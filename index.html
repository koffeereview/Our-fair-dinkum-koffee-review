<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- PRECONNECT HINTS — load critical resources faster -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://docs.google.com">
    <link rel="dns-prefetch" href="https://docs.google.com">
    <link rel="dns-prefetch" href="https://www.googletagmanager.com">

    <!-- PRELOAD BEBAS NEUE — breaks the font chain -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap">

    <!-- FONT FALLBACK — prevents CLS when Bebas Neue swaps in -->
    <style>
      @font-face {
        font-family: 'Bebas Neue Fallback';
        src: local('Arial');
        size-adjust: 98%;
        ascent-override: 92%;
        descent-override: 24%;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: #0a0a0a; margin: 0; padding: 0; }
      #root { background: #0a0a0a; min-height: 100vh; }
    </style>

    <!-- PRIMARY SEO -->
    <title>Our Fair Dinkum Koffee Review | 600+ Café Reviews Across Australia</title>
    <meta name="description" content="Honest Australian café reviews. 600+ coffees reviewed across Brisbane, Melbourne, Gold Coast and more. We order the same thing every time — One Latte & One Double Shot Espresso. Know before you go." />
    <meta name="keywords" content="coffee review australia, café review brisbane, best coffee brisbane, best coffee melbourne, australian coffee review, koffee review, fair dinkum coffee, café ratings australia, brisbane café guide, gold coast coffee" />
    <meta name="author" content="Our Fair Dinkum Koffee Review" />
    <link rel="canonical" href="https://koffeereview.com.au" />

    <!-- OPEN GRAPH (Facebook, LinkedIn previews) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://koffeereview.com.au" />
    <meta property="og:title" content="Our Fair Dinkum Koffee Review | 600+ Café Reviews Across Australia" />
    <meta property="og:description" content="Honest Australian café reviews. 600+ coffees reviewed across Brisbane, Melbourne, Gold Coast and more. Know before you go." />
    <meta property="og:image" content="https://koffeereview.com.au/logo.webp" />
    <meta property="og:site_name" content="Our Fair Dinkum Koffee Review" />
    <meta property="og:locale" content="en_AU" />

    <!-- TWITTER / X CARD -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://koffeereview.com.au" />
    <meta name="twitter:title" content="Our Fair Dinkum Koffee Review | 600+ Café Reviews Across Australia" />
    <meta name="twitter:description" content="Honest Australian café reviews. 600+ coffees reviewed. Know before you go." />
    <meta name="twitter:image" content="https://koffeereview.com.au/logo.webp" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Koffee Review" />
    <link rel="apple-touch-icon" href="/logo.webp" />

    <!-- FAVICON -->
    <link rel="icon" type="image/jpeg" href="/logo.webp" />

    <!-- STRUCTURED DATA (Google Rich Results) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Our Fair Dinkum Koffee Review",
      "url": "https://koffeereview.com.au",
      "description": "Honest Australian café reviews. 600+ coffees reviewed across Brisbane, Melbourne, Gold Coast and more.",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://koffeereview.com.au/?search={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Our Fair Dinkum Koffee Review",
      "alternateName": ["Koffee Review", "KoffeeReview", "OFDK Review"],
      "url": "https://koffeereview.com.au",
      "logo": "https://koffeereview.com.au/logo.webp",
      "image": "https://koffeereview.com.au/logo.webp",
      "description": "Independent Australian cafe review website. We review cafes across Brisbane, Gold Coast, Melbourne, Sydney and more by ordering the same two drinks every time: one latte and one double shot espresso. No sponsorships, no paid placements. 600+ cafes reviewed since 2021.",
      "foundingDate": "2021",
      "areaServed": {
        "@type": "Country",
        "name": "Australia"
      },
      "knowsAbout": ["coffee reviews", "cafe reviews", "espresso", "latte", "Brisbane cafes", "Australian coffee", "cafe ratings", "coffee scoring"],
      "slogan": "One Latte. One Double Shot. Every Time.",
      "sameAs": [
        "https://www.instagram.com/koffeereview",
        "https://www.tiktok.com/@koffeereview",
        "https://www.youtube.com/@koffeereview",
        "https://linktr.ee/koffeereview"
      ],
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "customer service",
        "url": "https://www.instagram.com/koffeereview"
      }
    }
    </script>

    <!-- GOOGLE ANALYTICS — delayed until 3s after load or first interaction -->
    <script>
      (function() {
        var loaded = false;
        function loadGA() {
          if (loaded) return;
          loaded = true;
          var s = document.createElement('script');
          s.src = 'https://www.googletagmanager.com/gtag/js?id=G-W8X0WSGZW0';
          s.async = true;
          document.head.appendChild(s);
          window.dataLayer = window.dataLayer || [];
          function gtag(){dataLayer.push(arguments);}
          gtag('js', new Date());
          gtag('config', 'G-W8X0WSGZW0', { send_page_view: true });
          window.gtag = gtag;
        }
        // Load after 3s delay
        window.addEventListener('load', function() {
          setTimeout(loadGA, 3000);
        });
        // Or on first user interaction (whichever comes first)
        ['scroll', 'touchstart', 'click', 'keydown'].forEach(function(evt) {
          document.addEventListener(evt, loadGA, { once: true, passive: true });
        });
      })();
    </script>

    <!-- SERVICE WORKER -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js');
        });
      }
    </script>
  </head>
  <body style="background:#0a0a0a;margin:0;padding:0;">
    <div id="root" style="background:#0a0a0a;min-height:100vh;"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
